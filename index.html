<style>
/* Layout: Alina's Figma system — one centered column of square IBM tiles, grouped under "Explore" / "Learn" / "Take action".
   Two sticker pages share it: #innovation (chandelier photo) and #safe (animated encryption stream). Single dark photographic look by design. */
:root {
  --ink: #050505;
  --fg: #ffffff;
  --sub: #e8e6e3;
  --label: #d6d3cf;
  --tile: #ffffff;
  --tile-hover: #f2f4f8;
  --tile-fg: #0050e6;
  --cta: #0050e6;
  --cta-hover: #0043c2;
  --sand: #bcb5ab;
  --code: #4589ff;
  --font: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { background: var(--ink); color: var(--fg); font-family: var(--font); -webkit-font-smoothing: antialiased; }

/* Backgrounds */
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
/* Innovation: full-viewport photo anchored center-bottom, dark fade at top.
   Drop a new assets/bg-innovation.jpg (< 300 KB, ideally also a .webp) to replace. */
.bg-innovation {
  background: url("assets/bg-innovation.jpg") center bottom / cover no-repeat, #0d0b09;
}
.bg-innovation .photo { display: none; }/* placeholder div kept in HTML, hidden */
.bg-safe { background: #02050c; }
.bg-safe canvas { width: 100%; height: 100%; display: block; }
.bg .fade { position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 24%, rgba(0,0,0,.18) 50%, rgba(0,0,0,0) 72%); }
.bg-safe .fade { background: linear-gradient(to bottom, rgba(0,0,0,.94) 0%, rgba(0,0,0,.6) 28%, rgba(0,0,0,.35) 60%, rgba(0,0,0,.55) 100%); }
.bg .grain { position: absolute; inset: 0; background: url("assets/grain.png") repeat; background-size: 150px 150px; }

main { position: relative; z-index: 1; max-width: 344px; margin: 0 auto;
  padding-inline: 16px; padding-block: 52px 72px;
  display: flex; flex-direction: column; align-items: center; text-align: center; }

.avatar { width: 88px; height: 88px; border-radius: 50%; display: block;
  box-shadow: 0 0 0 1.5px rgba(0,0,0,.6), 0 12px 32px rgba(0,0,0,.45); }
.series { margin: 18px 0 0; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--label); }
h1 { margin: 20px 0 8px; font-size: 26px; font-weight: 600; letter-spacing: -.005em; text-wrap: balance; }
.sub { margin: 0; color: var(--sub); font-size: 17px; font-weight: 300; line-height: 1.4; text-wrap: balance; max-width: 30ch; }

.group { width: 100%; margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }
.group + .group { margin-top: 28px; }
.gh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 2px; text-align: left; }
.gh h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .14em;
  text-transform: uppercase; color: var(--fg); text-shadow: 0 1px 2px rgba(0,0,0,.7), 0 0 14px rgba(0,0,0,.65); }

.tile { display: flex; align-items: center; justify-content: space-between; gap: 16px; box-sizing: border-box;
  min-height: 56px; padding: 8px 16px; background: var(--tile); color: var(--tile-fg);
  font-size: 16px; letter-spacing: .01em; text-decoration: none; text-align: left;
  transition: background-color .11s ease; }
button.tile { width: 100%; border: 0; font-family: inherit; cursor: pointer; }
.tile .tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .s { font-size: 13px; letter-spacing: 0; color: #525252; }
.tile:hover { background: var(--tile-hover); }
.tile:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; box-shadow: inset 0 0 0 2px var(--cta); }
.tile svg { width: 18px; height: 18px; flex: none; }
.tile.cta { background: var(--cta); color: var(--fg); min-height: 64px; }
.tile.cta .l, .tile.ghost .l { font-weight: 600; }
.tile.cta .s, .tile.ghost .s { color: rgba(255,255,255,.88); }
.tile.cta:hover { background: var(--cta-hover); }
.tile.cta:focus-visible { box-shadow: inset 0 0 0 2px var(--fg); outline-color: var(--cta); }
.tile.ghost { background: rgba(0,0,0,.6); color: var(--fg); min-height: 64px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
.tile.ghost:hover { background: rgba(255,255,255,.12); }
.tile.ghost:focus-visible { outline-color: var(--fg); box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }

.mail { margin-top: 20px; display: inline-flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,.6); padding: 6px 6px 6px 12px; font-size: 13px; }
.mail code { font-family: inherit; user-select: all; }
.copy { font: inherit; font-size: 12px; color: var(--fg); background: transparent;
  border: 1px solid rgba(255,255,255,.5); padding: 4px 10px; cursor: pointer; }
.copy:hover { background: rgba(255,255,255,.12); }
.copy:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

.switch { margin-top: 28px; color: var(--fg); font-size: 14px; text-decoration: underline;
  text-underline-offset: 3px; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
.switch:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }


/* Sheets: takeaways, case studies, readiness check, host-a-session */
dialog.sheet { border: 0; padding: 0; width: min(100% - 32px, 400px); max-height: calc(100% - 32px);
  background: #fff; color: #161616; font-family: var(--font); overscroll-behavior: contain; }
dialog.sheet::backdrop { background: rgba(0,0,0,.6); }
.sheet-in { padding: 20px 16px 16px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.sheet .eyebrow { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--cta); }
.sheet h3 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.25; }
.sheet h4 { margin: 0; font-size: 15px; font-weight: 600; }
.sheet p { margin: 0; font-size: 15px; line-height: 1.5; }
.sheet .x { font: inherit; font-size: 22px; line-height: 1; background: none; border: 0; cursor: pointer; color: #161616; padding: 4px 8px; flex: none; }
.sheet .x:focus-visible, .sheet .btn:focus-visible, .sheet summary:focus-visible, .sheet a:focus-visible, .sheet .opt input:focus-visible + span { outline: 2px solid var(--cta); outline-offset: 2px; }
.sheet .lead { color: #525252; }
.sheet .lbl { font-size: 12px; color: #525252; letter-spacing: .02em; }
.sheet ul, .sheet ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.5; }
.sheet hr { width: 100%; border: 0; border-top: 1px solid #e0e0e0; margin: 4px 0; }
.sheet textarea { width: 100%; box-sizing: border-box; height: 200px; resize: vertical; border: 1px solid #c6c6c6;
  background: #f4f4f4; padding: 10px; font: 13px/1.45 var(--font); color: #161616; }
.sheet .row { display: flex; flex-direction: column; gap: 8px; }
.sheet .btn { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 12px; font: inherit; font-size: 15px;
  text-decoration: none; cursor: pointer; border: 0; text-align: center; }
.sheet .btn.primary { background: var(--cta); color: #fff; }
.sheet .btn.primary:hover { background: var(--cta-hover); }
.sheet .btn.secondary { background: #fff; color: var(--cta); border: 1px solid var(--cta); }
.sheet .btn.secondary:hover { background: var(--tile-hover); }
.sheet .note { font-size: 12px; color: #525252; }
.sheet .more { color: var(--cta); font-size: 15px; }

.case { display: flex; flex-direction: column; gap: 2px; padding: 12px; border: 1px solid #c6c6c6; text-decoration: none; color: #161616; }
.case:hover, .case:focus-visible { background: #edf5ff; border-color: var(--cta); box-shadow: inset 0 0 0 1px var(--cta); }
.case .cat { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #525252; }
.case .nm { font-size: 20px; font-weight: 600; color: var(--cta); }
.case .ds { font-size: 15px; line-height: 1.4; }

fieldset.q { margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
fieldset.q legend { padding: 0; margin-bottom: 6px; font-size: 15px; line-height: 1.4; }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); }
.opt { position: relative; display: block; }
.opt input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.opt span { display: flex; align-items: center; justify-content: center; min-height: 44px; border: 1px solid var(--cta); margin-left: -1px;
  color: var(--cta); font-size: 14px; background: #fff; }
.opt:first-child span { margin-left: 0; }
.opt input:checked + span { background: var(--cta); color: #fff; }
.sheet details { border-top: 1px solid #e0e0e0; padding-top: 8px; }
.sheet summary { cursor: pointer; font-size: 15px; font-weight: 600; min-height: 40px; display: flex; align-items: center; }
.sheet details[open] summary { margin-bottom: 8px; }
.sheet details > * + * { margin-top: 12px; }
.sheet .quote { background: #f4f4f4; padding: 10px; font-size: 14px; line-height: 1.5; white-space: pre-line; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } }
</style>

        { q: "Do you know when your key suppliers and vendors will move to quantum-safe cryptography?", topic: "Quantum-safe readiness of our suppliers and vendors" },
        { q: "Does someone in your organization own the move to quantum-safe cryptography?", topic: "Ownership and a roadmap for quantum-safe migration" },
        { q: "Could you swap your cryptography for a new standard without rebuilding your systems?", topic: "Crypto-agility: making our systems easy to update" }

    host: {

      points: [

};
var EMAIL = "alina.wundsam@ibm.com"; // TODO: swap for the Innovation Studio inbox if there is one
/* ============================= */

function $(id) { return document.getElementById(id); }
function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
var codeAnim = null, curKey = 'innovation', answers = [];

function setTile(name, label, sub) {
  var t = document.querySelector('[data-tile="' + name + '"]');
  t.querySelector('.l').textContent = label; t.querySelector('.s').textContent = sub || ''; t.querySelector('.s').hidden = !sub;
  return t;
}
function topics() {
  var q = PAGES[curKey].check, out = [];
  if (q) q.questions.forEach(function (x, i) { if (answers[i] === 'no' || answers[i] === 'unsure') out.push(x.topic); });
  return out;
}
function hostText() {
  var c = PAGES.common.host, h = PAGES[curKey].host, t = topics();
  var lines = [c.greeting, "", h.intro, ""];
  if (t.length) { lines.push(c.topicsLead); t.forEach(function (x) { lines.push("\u2013 " + x); }); lines.push(""); }
  return lines.concat(c.fields, ["", c.signoff]).join("\n");
}
function updateMailto() {
  $('hOpen').href = 'mailto:' + EMAIL + '?subject=' + encodeURIComponent(PAGES[curKey].host.subject) +
    '&body=' + encodeURIComponent($('hBody').value.replace(/\n/g, '\r\n'));
}
function refreshHost() { $('hBody').value = hostText(); updateMailto(); }

function updateResult() {
  var ck = PAGES.safe.check, n = { yes: 0, no: 0, unsure: 0 }, any = false;
  answers.forEach(function (a) { if (a) { n[a]++; any = true; } });
  var g = n.no + n.unsure;
  $('checkResult').textContent = !any ? ck.pending :
    ck.resultTpl.replace('{yes}', n.yes).replace('{no}', n.no).replace('{unsure}', n.unsure)
      .replace('{gaps}', g === 1 ? '1 topic' : g + ' topics');
}

function render() {
  var key = location.hash.replace('#', '') === 'safe' ? 'safe' : 'innovation';
  var p = PAGES[key], c = PAGES.common;
  curKey = key; answers = [];
  Array.prototype.forEach.call(document.querySelectorAll('dialog[open]'), function (d) { d.close(); });
  document.body.setAttribute('data-topic', key);
  document.title = p.title + ' · Quantum Journey';
  $('title').textContent = p.title;
  $('subtitle').textContent = p.subtitle;
  $('exploreH').textContent = c.groups.explore.title;
  $('learnH').textContent = c.groups.learn.title;    
  $('actH').textContent = c.groups.act.title;        

  /* Explore */
  setTile('takeaways', c.takeaways.label, c.takeaways.sub);
  setTile('podcast', c.podcast.label, p.podcast.sub).href = p.podcast.url;
  $('takeEye').textContent = p.takeaways.eyebrow; $('takeH').textContent = p.takeaways.heading;
  clear($('takeList'));
  p.takeaways.items.forEach(function (t) { $('takeList').appendChild(el('li', null, t)); });
  $('takeCopy').textContent = c.takeaways.copy;
  $('takeNote').textContent = c.takeaways.note;
  $('takePost').hidden = true;
  $('takePost').textContent = p.takeaways.postIntro + "\n\n" +
    p.takeaways.items.map(function (t) { return "\u2022 " + t; }).join("\n") + "\n\n" + p.takeaways.postOutro;

  /* Learn */
  var lt = $('learnTile'), L = p.cases || p.check;
  setTile('learn', L.label, L.sub);
  lt.setAttribute('data-open', p.cases ? 'sheetCases' : 'sheetCheck');
  setTile('course', c.course.label, c.course.sub).href = c.course.url;
  if (p.cases) {
    $('casesEye').textContent = p.cases.eyebrow; $('casesH').textContent = p.cases.heading; $('casesLead').textContent = p.cases.lead; $('casesLead').hidden = !p.cases.lead;
    clear($('caseList'));
    p.cases.items.forEach(function (x) {
      var a = el('a', 'case'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener';
      a.appendChild(el('span', 'cat', x.cat)); a.appendChild(el('span', 'nm', x.name)); a.appendChild(el('span', 'ds', x.desc));
      $('caseList').appendChild(a);
    });
    $('casesAll').href = p.cases.allUrl; $('casesAll').textContent = p.cases.allLabel;
  }
  if (p.check) {
    var ck = p.check;
    $('checkEye').textContent = ck.eyebrow; $('checkH').textContent = ck.heading; $('checkLead').textContent = ck.lead;
    $('checkHost').textContent = ck.cta;
    clear($('qList'));
    ck.questions.forEach(function (x, i) {
      var fs = el('fieldset', 'q'), opts = el('div', 'opts');
      fs.appendChild(el('legend', null, (i + 1) + ". " + x.q));
      ck.options.forEach(function (o) {
        var lab = el('label', 'opt'), inp = el('input'); inp.type = 'radio'; inp.name = 'q' + i; inp.value = o[0];
        inp.addEventListener('change', function () { answers[i] = o[0]; updateResult(); refreshHost(); });
        lab.appendChild(inp); lab.appendChild(el('span', null, o[1])); opts.appendChild(lab);
      });
      fs.appendChild(opts); $('qList').appendChild(fs);
    });
    updateResult();
  }

  /* Take action */
  var h = c.host;
  setTile('host', h.label, h.sub);
  setTile('event', c.event.label, c.event.sub).href = p.event.url;
  $('hostEye').textContent = h.eyebrow; $('hostH').textContent = h.heading; $('hostPitch').textContent = h.pitch;
  clear($('hostBullets'));
  h.bullets.forEach(function (b) { var li = el('li'); li.appendChild(el('strong', null, b[0])); li.appendChild(document.createTextNode(b[1])); $('hostBullets').appendChild(li); });
  $('reqH').textContent = h.requestTitle; $('reqHelp').textContent = h.requestHelp + " (" + EMAIL + ").";
  $('buyinH').textContent = h.buyinTitle; $('noteLead').textContent = h.noteLead;
  clear($('buyinList'));
  p.host.points.forEach(function (t) { $('buyinList').appendChild(el('li', null, t)); });
  $('buyinNote').textContent = p.host.note;
  $('buyin').open = false;
  refreshHost();

  $('switch').href = '#' + p.other; $('switch').textContent = p.otherLabel;
  $('bgInnovation').hidden = key !== 'innovation';
  $('bgSafe').hidden = key !== 'safe';
  if (key === 'safe') startCode(); else stopCode();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);


/* Encryption stream: columns of hex/glyphs falling; now and then one column spells QUANTUM SAFE */
var c = $('code'), ctx = c.getContext('2d'), cols = [], fs = 15, W = 0, H = 0, last = 0;
var GLYPHS = '0123456789ABCDEF#$%&*+=<>/\\|{}[]';
var WORD = 'QUANTUM SAFE';
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeCanvas() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = c.clientWidth; H = c.clientHeight; c.width = W * dpr; c.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  var n = Math.ceil(W / fs); cols = [];
  for (var i = 0; i < n; i++) cols.push({ y: Math.random() * H, v: .4 + Math.random() * .9, word: -1 });
  ctx.fillStyle = '#02050c'; ctx.fillRect(0, 0, W, H);
}
function frame(t) {
  if (t - last < 55) { codeAnim = requestAnimationFrame(frame); return; }
  last = t;
  ctx.fillStyle = 'rgba(2,5,12,0.14)'; ctx.fillRect(0, 0, W, H);
  ctx.font = fs + 'px ' + getComputedStyle(document.body).getPropertyValue('--mono');
  for (var i = 0; i < cols.length; i++) {
    var col = cols[i], ch, x = i * fs;
    if (col.word >= 0) {
      ch = WORD[col.word]; col.word++;
      ctx.fillStyle = '#d0e2ff';
      if (col.word >= WORD.length) col.word = -1;
    } else {
      ch = GLYPHS[(Math.random() * GLYPHS.length) | 0];
      ctx.fillStyle = Math.random() < .08 ? '#a6c8ff' : 'rgba(69,137,255,.75)';
    }
    ctx.fillText(ch, x, col.y);
    col.y += fs * col.v;
    if (col.y > H + fs) { col.y = -Math.random() * 200; col.v = .4 + Math.random() * .9;
      if (Math.random() < .04) col.word = 0; }
  }
  codeAnim = requestAnimationFrame(frame);
}
function startCode() {
  sizeCanvas();
  if (reduce) { for (var k = 0; k < 60; k++) frame(k * 60); cancelAnimationFrame(codeAnim); codeAnim = null; return; }
  if (!codeAnim) codeAnim = requestAnimationFrame(frame);
}
function stopCode() { if (codeAnim) cancelAnimationFrame(codeAnim); codeAnim = null; }
var rt; window.addEventListener('resize', function () { clearTimeout(rt);
  rt = setTimeout(function () { if (!$('bgSafe').hidden) sizeCanvas(); }, 150); });

/* Sheets */
Array.prototype.forEach.call(document.querySelectorAll('.tile[data-open], #learnTile'), function (b) {
  b.addEventListener('click', function () { $(this.getAttribute('data-open')).showModal(); });
});
Array.prototype.forEach.call(document.querySelectorAll('dialog.sheet'), function (d) {
  d.addEventListener('click', function (e) { if (e.target === this) this.close(); });
});
Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) {
  b.addEventListener('click', function () { this.closest('dialog').close(); });
});
$('checkHost').addEventListener('click', function () { $('sheetCheck').close(); $('sheetHost').showModal(); });

function copyText(text, btn, idle, onFail) {
  function reset() { setTimeout(function () { btn.textContent = idle; }, 1800); }
  function done() { btn.textContent = 'Copied'; reset(); }
  function fail() { btn.textContent = 'Couldn\u2019t copy. Select the text instead'; if (onFail) onFail(); reset(); }
  try { navigator.clipboard.writeText(text).then(done, fail); } catch (err) { fail(); }
}
$('takeCopy').addEventListener('click', function () {
  copyText($('takePost').textContent, this, PAGES.common.takeaways.copy, function () { $('takePost').hidden = false; });
});
$('hCopy').addEventListener('click', function () {
  copyText('To: ' + EMAIL + '\nSubject: ' + PAGES[curKey].host.subject + '\n\n' + $('hBody').value, this, 'Copy email and message',
    function () { $('hBody').focus(); $('hBody').select(); });
});
$('noteCopy').addEventListener('click', function () {
  copyText($('buyinNote').textContent, this, 'Copy note');
});
$('hBody').addEventListener('input', updateMailto);

render();
</script>
